    <figure style="overflow:visible;" id="spinner"></figure>

      <progress value="0" max="100" id="progress" hidden=1></progress>

      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1 onclick="requestPointerLock()"></canvas>
    </div>

    <script>const statusElement=document.getElementById("status");const progressElement=document.getElementById("progress");const spinnerElement=document.getElementById("spinner");const canvasElement=document.getElementById("canvas");function mergeFiles(fileParts,cb){return new Promise((resolve,reject)=>{let buffers=[];function fetchPart(index){if(index>=fileParts.length){let mergedBlob=new Blob(buffers);resolve(mergedBlob);return}fetch(fileParts[index]).then(response=>{if(!response.ok)throw new Error("Failed to load "+fileParts[index]);return response.arrayBuffer()}).then(data=>{buffers.push(data);cb(index+1);fetchPart(index+1)}).catch(reject)}fetchPart(0)})}function getParts(baseName,total){let parts=[];for(let i=1;i<=total;i++){parts.push(`${baseName}.part${i}`)}return parts}async function prepareDataFile(){const parts=getParts("index.data",24);statusElement.innerHTML="Merging data parts (0/24)...";const blob=await mergeFiles(parts,loaded=>{statusElement.innerHTML=`Merging data parts (${loaded}/${parts.length})...`});const mergedFile=new File([blob],"index.data");const url=URL.createObjectURL(mergedFile);return url}var Module={canvas:canvasElement,setStatus(text){statusElement.textContent=text},monitorRunDependencies(left){progressElement.hidden=!left;if(left){progressElement.value=100-left*20}}};(async()=>{try{const dataUrl=await prepareDataFile();console.log("Merged index.data ready:",dataUrl);const origFetch=window.fetch;window.fetch=(input,init)=>{if(typeof input==="string"&&input.endsWith("index.data")){return origFetch(dataUrl,init)}return origFetch(input,init)};const script=document.createElement("script");script.src="index.js";document.body.appendChild(script)}catch(err){console.error(err);statusElement.textContent="Error merging data files."}})();</script>
